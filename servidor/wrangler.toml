name = "lolautopick"
main = "src/index.js"
compatibility_date = "2025-06-01"

# Uma rodada por minuto: ~6 pedidos à Riot (cabe no limite da chave pessoal) e ~55 linhas gravadas no D1
# (cabe nas 100 mil por dia do plano grátis). No plano pago dá para subir PARTIDAS_POR_RODADA.
[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "autopick-runas"
database_id = "3781a376-c50c-4714-ab03-da43a1c50c89"

[vars]
PARTIDAS_POR_RODADA = "4"
# Trava: ao gravar isto no dia (UTC), a coleta pausa até a meia-noite UTC. O plano grátis do D1 permite 100 mil.
# No plano pago (50 milhões por mês) pode subir para ~1600000.
LIMITE_ESCRITAS_DIA = "90000"
