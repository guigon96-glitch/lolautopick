# Compila o AutoPickLoL.exe, roda os testes e publica o .exe na release "ultima".
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  app:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Instalar compilador C# (Mono)
        run: sudo apt-get update -q && sudo apt-get install -y -q mono-mcs libmono-system-windows-forms4.0-cil libmono-system-web-extensions4.0-cil
      - name: Compilar
        run: mcs -target:winexe -optimize -out:AutoPickLoL.exe -r:System.Windows.Forms.dll -r:System.Drawing.dll -r:System.Web.Extensions.dll app/Program.cs
      - name: Testes
        run: mono AutoPickLoL.exe --teste
      - uses: actions/upload-artifact@v4
        with:
          name: AutoPickLoL
          path: AutoPickLoL.exe
      - name: Publicar na release "ultima"
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip AutoPickLoL.zip AutoPickLoL.exe
          gh release view ultima >/dev/null 2>&1 || gh release create ultima --title "AutoPick LoL (última versão)" --notes "Baixe o AutoPickLoL.zip, extraia e abra o AutoPickLoL.exe."
          gh release upload ultima AutoPickLoL.zip --clobber

  servidor:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: servidor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Testes do coletor
        run: node teste.mjs
